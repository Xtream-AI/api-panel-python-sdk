[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xtream-ai-api-panel-sdk"
version = "1.0.0"
description = "Official Python SDK for the Xtream AI Streaming Panel API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xtream AI"}]
keywords = ["xtream-ai", "iptv", "panel", "api", "sdk", "billing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "responses>=0.24"]

[project.urls]
Homepage = "https://xtreamai.net/docs/?page=panel-api-overview"
Source = "https://github.com/Xtream-AI/api-panel-python-sdk"
Issues = "https://github.com/Xtream-AI/api-panel-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["xtream_ai_panel_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
